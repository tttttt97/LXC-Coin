services:
  lxc-node-0:
    build: .
    container_name: lxc-node-0
    dns:
      - 8.8.8.8
      - 114.114.114.114
    ports:
      - "5000:5000"
    command: ["-p", "5000"]
    environment:
      - BLOCKCHAIN_DATA_DIR=/app/data
    volumes:
      - node0_data:/app/data
    networks:
      - bc-net

  lxc-node-1:
    build: .
    container_name: lxc-node-1
    dns:
      - 8.8.8.8
      - 114.114.114.114
    ports:
      - "5001:5001"
    command: ["-p", "5001"]
    environment:
      - BLOCKCHAIN_DATA_DIR=/app/data
    volumes:
      - node1_data:/app/data
    networks:
      - bc-net

  lxc-node-2:
    build: .
    container_name: lxc-node-2
    dns:
      - 8.8.8.8
      - 114.114.114.114
    ports:
      - "5002:5002"
    command: ["-p", "5002"]
    environment:
      - BLOCKCHAIN_DATA_DIR=/app/data
    volumes:
      - node2_data:/app/data
    networks:
      - bc-net

volumes:
  node0_data:
  node1_data:
  node2_data:

networks:
  bc-net:
    driver: bridge
