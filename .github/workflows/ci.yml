name: LXC-Coin CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Compile check
        run: |
          python -c "
          import py_compile, glob, os
          py_files = [f for f in glob.glob('**/*.py', recursive=True) if '__pycache__' not in f and '.github' not in f]
          for f in py_files:
              py_compile.compile(f, doraise=True)
          print(f'All {len(py_files)} files compile OK')
          "

      - name: Lint check
        run: ruff check . --ignore=E501,E402,F401,F841 --show-fixes || true

      - name: Run unit tests
        run: python -m pytest test_blockchain.py -v --tb=short
