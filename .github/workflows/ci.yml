name: LXC-Coin CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile check
        run: python -m py_compile blockchain/chain.py blockchain/__init__.py api/routes.py api/middleware.py api/__init__.py network/p2p.py network/__init__.py utils/crypto.py utils/storage.py utils/__init__.py config.py main.py

      - name: Run unit tests
        run: python -m pytest test_blockchain.py -v --tb=short
